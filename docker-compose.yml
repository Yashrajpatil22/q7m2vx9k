
services:
  backend:
    build:
      context: ./backend
    container_name: windscope-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: windscope-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
